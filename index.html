<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>小墨 | 夜色陪伴</title>
  <style>
    :root {
      --bg-deep: #0b1118;
      --bg-soft: #101a24;
      --panel: rgba(16, 26, 36, 0.82);
      --panel-border: rgba(148, 172, 196, 0.24);
      --text-main: #e7edf3;
      --text-muted: #95a8b8;
      --bubble-ai: #1a2936;
      --bubble-user: #2f2d3c;
      --accent: #82b8a9;
      --accent-warm: #c8936f;
      --radius-lg: 24px;
      --radius-md: 18px;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      color: var(--text-main);
      font-family: "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Microsoft YaHei", sans-serif;
      letter-spacing: 0.02em;
      background:
        radial-gradient(120% 95% at 10% 0%, rgba(122, 160, 181, 0.13), transparent 45%),
        radial-gradient(95% 60% at 90% 100%, rgba(126, 166, 119, 0.16), transparent 48%),
        linear-gradient(168deg, var(--bg-deep), #0d141d 52%, var(--bg-soft));
    }

    body {
      display: flex;
      justify-content: center;
      padding: 16px;
    }

    .app {
      width: min(900px, 100%);
      min-height: calc(100dvh - 32px);
      background: var(--panel);
      border: 1px solid var(--panel-border);
      border-radius: 26px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      box-shadow: 0 26px 60px rgba(0, 0, 0, 0.42);
      backdrop-filter: blur(12px);
    }

    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(148, 172, 196, 0.22);
      background: linear-gradient(180deg, rgba(160, 179, 197, 0.08), rgba(16, 26, 36, 0));
    }

    .avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid rgba(214, 222, 232, 0.35);
      background: #243647;
      flex-shrink: 0;
    }

    .title {
      min-width: 0;
    }

    .title h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.2;
    }

    .title p {
      margin: 2px 0 0;
      color: var(--text-muted);
      font-size: 12px;
    }

    .chat {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }

    .msg {
      max-width: 94%;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .msg.ai {
      align-self: flex-start;
    }

    .msg.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg-icon {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid rgba(212, 223, 233, 0.32);
      object-fit: cover;
      background: #304052;
      flex-shrink: 0;
    }

    .msg.user .msg-icon {
      background: #473f57;
      border-color: rgba(196, 184, 216, 0.35);
    }

    .bubble {
      padding: 12px 14px;
      border-radius: var(--radius-lg);
      line-height: 1.72;
      font-size: 15px;
      white-space: pre-wrap;
      word-break: break-word;
      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.18);
    }

    .msg.ai .bubble {
      background: var(--bubble-ai);
      border-bottom-left-radius: 10px;
    }

    .msg.user .bubble {
      background: var(--bubble-user);
      border-bottom-right-radius: 10px;
    }

    .typing {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      min-height: 22px;
    }

    .typing span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: rgba(231, 237, 243, 0.74);
      animation: blink 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) {
      animation-delay: 0.2s;
    }

    .typing span:nth-child(3) {
      animation-delay: 0.4s;
    }

    @keyframes blink {
      0%, 80%, 100% {
        transform: translateY(0);
        opacity: 0.28;
      }
      40% {
        transform: translateY(-2px);
        opacity: 1;
      }
    }

    .composer {
      padding: 12px;
      border-top: 1px solid rgba(148, 172, 196, 0.2);
      background: rgba(16, 26, 36, 0.56);
    }

    .composer-inner {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      border: 1px solid rgba(150, 175, 198, 0.32);
      border-radius: var(--radius-md);
      background: rgba(11, 17, 24, 0.58);
      padding: 8px;
    }

    textarea {
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      min-height: 44px;
      max-height: 140px;
      background: transparent;
      color: var(--text-main);
      font-size: 15px;
      line-height: 1.6;
      padding: 7px 8px;
    }

    textarea::placeholder {
      color: #8ca0b0;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 10px 14px;
      font-size: 14px;
      font-weight: 700;
      color: #11222c;
      background: linear-gradient(135deg, var(--accent), var(--accent-warm));
      cursor: pointer;
      transition: transform 0.15s ease, opacity 0.2s ease;
      flex-shrink: 0;
    }

    button:hover {
      transform: translateY(-1px);
    }

    button:disabled {
      opacity: 0.58;
      cursor: not-allowed;
      transform: none;
    }

    .hint {
      margin: 8px 4px 0;
      color: var(--text-muted);
      font-size: 12px;
    }

    @media (max-width: 640px) {
      body {
        padding: 0;
      }

      .app {
        width: 100%;
        min-height: 100dvh;
        border-radius: 0;
        border-left: none;
        border-right: none;
      }

      .msg {
        max-width: 98%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <img id="topAvatar" class="avatar" src="./avatar.jpg" alt="小墨头像" />
      <div class="title">
        <h1>小墨</h1>
        <p>在你身边，慢慢聊，不着急。</p>
      </div>
    </header>

    <section id="chat" class="chat" aria-live="polite"></section>

    <footer class="composer">
      <div class="composer-inner">
        <textarea id="input" placeholder="想说什么都可以，按 Enter 发送，Shift+Enter 换行"></textarea>
        <button id="send" type="button">发送</button>
      </div>
      <p class="hint">你的聊天记录仅保存在当前浏览器（localStorage）。</p>
    </footer>
  </main>

  <script>
    const STORAGE_KEY = "xiaomo_history_v1";
    const AVATAR_URL = "./avatar.jpg";
    const HISTORY_LIMIT = 20;

    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const topAvatarEl = document.getElementById("topAvatar");

    topAvatarEl.src = AVATAR_URL;

    const fallbackAvatar =
      "data:image/svg+xml;utf8," +
      encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96'><defs><linearGradient id='g' x1='0' x2='1' y1='0' y2='1'><stop offset='0%' stop-color='%236a8aa0'/><stop offset='100%' stop-color='%2377a08f'/></linearGradient></defs><rect rx='48' ry='48' width='96' height='96' fill='url(%23g)'/><text x='50%' y='56%' text-anchor='middle' font-size='42' fill='white' font-family='sans-serif'>墨</text></svg>");

    topAvatarEl.onerror = () => {
      topAvatarEl.src = fallbackAvatar;
    };

    let messages = loadMessages();

    if (messages.length === 0) {
      messages.push({
        role: "assistant",
        content: "嗨，我是小墨。你可以慢慢说，我会认真听。",
        ts: Date.now(),
      });
      saveMessages();
    }

    renderAll();
    inputEl.focus();

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage();
      }
    });

    function loadMessages() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          return [];
        }
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) {
          return [];
        }
        return parsed
          .filter(
            (item) =>
              item &&
              (item.role === "user" || item.role === "assistant") &&
              typeof item.content === "string"
          )
          .slice(-HISTORY_LIMIT);
      } catch {
        return [];
      }
    }

    function saveMessages() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(messages.slice(-HISTORY_LIMIT)));
    }

    function renderAll() {
      chatEl.innerHTML = "";
      for (const item of messages) {
        chatEl.appendChild(createMessageNode(item.role, item.content));
      }
      scrollToBottom();
    }

    function createMessageNode(role, text) {
      const row = document.createElement("article");
      row.className = `msg ${role}`;

      const icon = document.createElement("img");
      icon.className = "msg-icon";
      icon.alt = role === "assistant" ? "小墨" : "你";
      icon.src = role === "assistant" ? topAvatarEl.src : fallbackAvatar;

      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.textContent = text;

      row.appendChild(icon);
      row.appendChild(bubble);
      return row;
    }

    function createTypingNode() {
      const row = document.createElement("article");
      row.className = "msg ai";

      const icon = document.createElement("img");
      icon.className = "msg-icon";
      icon.alt = "小墨";
      icon.src = topAvatarEl.src;

      const bubble = document.createElement("div");
      bubble.className = "bubble";

      const typing = document.createElement("div");
      typing.className = "typing";
      typing.innerHTML = "<span></span><span></span><span></span>";

      bubble.appendChild(typing);
      row.appendChild(icon);
      row.appendChild(bubble);
      return row;
    }

    function appendMessage(role, text) {
      messages.push({ role, content: text, ts: Date.now() });
      messages = messages.slice(-HISTORY_LIMIT);
      saveMessages();
      chatEl.appendChild(createMessageNode(role, text));
      scrollToBottom();
    }

    function scrollToBottom() {
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function setSending(isSending) {
      sendBtn.disabled = isSending;
      inputEl.disabled = isSending;
    }

    function buildHistoryPayload() {
      return messages
        .map(({ role, content }) => ({ role, content }))
        .slice(-HISTORY_LIMIT);
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text) {
        return;
      }

      appendMessage("user", text);
      inputEl.value = "";
      inputEl.style.height = "44px";
      setSending(true);

      const typingNode = createTypingNode();
      chatEl.appendChild(typingNode);
      scrollToBottom();

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            message: text,
            history: buildHistoryPayload(),
          }),
        });

        const data = await response.json().catch(() => ({}));
        typingNode.remove();

        if (!response.ok) {
          throw new Error(data.error || "请求失败，请稍后重试");
        }

        appendMessage(
          "assistant",
          data.reply || "我在这儿，刚刚有点走神了。你愿意再说一次吗？"
        );
      } catch (error) {
        typingNode.remove();
        appendMessage(
          "assistant",
          "我刚刚没连上情绪频道，我们再试一次。我在。"
        );
        console.error(error);
      } finally {
        setSending(false);
        inputEl.focus();
      }
    }

    inputEl.addEventListener("input", () => {
      inputEl.style.height = "44px";
      inputEl.style.height = `${Math.min(inputEl.scrollHeight, 140)}px`;
    });
  </script>
</body>
</html>
