<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>小墨 | 夜色陪伴</title>
  <style>
    :root {
      --bg-deep: #0a1017; --bg-soft: #111a24; --panel: rgba(17, 27, 38, 0.86); --panel-border: rgba(144, 167, 188, 0.22);
      --text-main: #e8eef4; --text-muted: #9fb1c0; --bubble-ai: #1c2a37; --bubble-user: #2f3141;
      --accent: #88b9a2; --accent-warm: #ca9269; --radius-lg: 28px; --radius-md: 20px; --danger: #d89292;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; color: var(--text-main); font-family: "PingFang SC", sans-serif; letter-spacing: .03em;
      background: radial-gradient(120% 95% at 10% 0%, rgba(122, 160, 181, .13), transparent 45%), radial-gradient(95% 60% at 90% 100%, rgba(126, 166, 119, .16), transparent 48%), linear-gradient(168deg, var(--bg-deep), #0d141d 52%, var(--bg-soft)); }
    body { display: flex; justify-content: center; padding: 16px; }
    .app { width: min(900px, 100%); min-height: calc(100dvh - 32px); background: var(--panel); border: 1px solid var(--panel-border); border-radius: 26px; overflow: hidden; display: flex; flex-direction: column; box-shadow: 0 22px 52px rgba(0,0,0,.46); }
    .topbar { display: flex; justify-content: space-between; gap: 12px; padding: 14px 16px; border-bottom: 1px solid rgba(148,172,196,.22); }
    .topbar-left { display: flex; align-items: center; gap: 12px; }
    .avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(214,222,232,.35); }
    .title h1 { margin: 0; font-size: 16px; } .title p { margin: 2px 0 0; color: var(--text-muted); font-size: 12px; }
    .mini-btn { border: 1px solid rgba(150,175,198,.35); border-radius: 12px; background: rgba(17,27,38,.6); color: var(--text-main); padding: 7px 10px; font-size: 12px; cursor: pointer; }

    .auth-wrap, .admin-wrap { margin: auto; width: min(480px, calc(100% - 28px)); border: 1px solid rgba(150,175,198,.28); border-radius: 20px; background: rgba(14,22,31,.76); padding: 16px; }
    .auth-sub { margin: 0 0 14px; color: var(--text-muted); font-size: 13px; }
    .auth-tabs { display: flex; gap: 8px; margin-bottom: 10px; }
    .auth-tab { flex: 1; border-radius: 12px; padding: 8px; border: 1px solid rgba(150,175,198,.3); background: rgba(20,32,45,.55); color: var(--text-main); cursor: pointer; }
    .auth-tab.active { border-color: rgba(136,185,162,.8); }
    .auth-field { margin-top: 8px; }
    .auth-field label { display: block; margin-bottom: 5px; font-size: 12px; color: var(--text-muted); }
    .auth-input-row { display: flex; gap: 8px; }
    .auth-field input { width: 100%; border-radius: 12px; border: 1px solid rgba(150,175,198,.32); background: rgba(11,17,24,.64); color: var(--text-main); padding: 10px 12px; outline: none; }
    .auth-toggle { border-radius: 12px; border: 1px solid rgba(150,175,198,.32); background: rgba(11,17,24,.64); color: var(--text-main); padding: 10px 12px; cursor: pointer; }
    .auth-submit { margin-top: 12px; width: 100%; border: none; border-radius: 12px; padding: 10px; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--accent-warm)); color: #11222c; cursor: pointer; }
    .auth-msg { min-height: 20px; margin-top: 8px; font-size: 12px; color: var(--text-muted); } .auth-msg.error { color: var(--danger); }

    .chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .msg { max-width: 94%; display: flex; gap: 10px; align-items: flex-end; } .msg.ai { align-self: flex-start; } .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg-icon { width: 28px; height: 28px; border-radius: 50%; border: 1px solid rgba(212,223,233,.32); object-fit: cover; background: #304052; }
    .bubble { padding: 13px 16px; border-radius: var(--radius-lg); line-height: 1.82; font-size: 15px; letter-spacing: .025em; white-space: pre-wrap; word-break: break-word; }
    .msg.ai .bubble { background: var(--bubble-ai); border-bottom-left-radius: 10px; } .msg.user .bubble { background: var(--bubble-user); border-bottom-right-radius: 10px; }

    .composer { padding: 12px; border-top: 1px solid rgba(148,172,196,.2); background: rgba(16,26,36,.62); }
    .composer-inner { display: flex; align-items: flex-end; gap: 10px; border: 1px solid rgba(150,175,198,.32); border-radius: var(--radius-md); background: rgba(11,17,24,.58); padding: 8px; }
    textarea { width: 100%; border: none; outline: none; resize: none; min-height: 44px; max-height: 140px; background: transparent; color: var(--text-main); font-size: 15px; line-height: 1.75; padding: 7px 8px; }
    .send-btn { border: none; border-radius: 14px; padding: 10px 14px; font-size: 14px; font-weight: 700; color: #11222c; background: linear-gradient(135deg, var(--accent), var(--accent-warm)); cursor: pointer; min-width: 72px; }
    .hint { margin: 8px 4px 0; color: var(--text-muted); font-size: 12px; }

    .admin-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 12px; }
    .admin-table th, .admin-table td { border-bottom: 1px solid rgba(150,175,198,.2); padding: 6px; text-align: left; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: grid; place-items: center; }
    .modal-card { width: min(420px, calc(100% - 24px)); background: #1b2735; border: 1px solid rgba(150,175,198,.35); border-radius: 14px; padding: 16px; }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="topbar-left">
        <img id="topAvatar" class="avatar" src="./avatar.jpg" alt="小墨头像" />
        <div class="title"><h1>小墨</h1><p id="statusText">在你身边，慢慢聊，不着急。</p></div>
      </div>
      <div style="display:flex; gap:8px;">
        <button id="adminToggleBtn" class="mini-btn" type="button">后台</button>
        <button id="logoutAllBtn" class="mini-btn hidden" type="button">下线全部设备</button>
        <button id="logoutBtn" class="mini-btn hidden" type="button">退出登录</button>
      </div>
    </header>

    <section id="authGate" class="auth-wrap">
      <h2>欢迎回来</h2>
      <p class="auth-sub">先登录，再和小墨慢慢聊。</p>
      <div class="auth-tabs"><button id="tabLogin" class="auth-tab active" type="button">登录</button><button id="tabRegister" class="auth-tab" type="button">注册</button></div>
      <div class="auth-field"><label for="authUsername">用户名</label><input id="authUsername" placeholder="3-32位，字母/数字/_/-" /></div>
      <div class="auth-field">
        <label for="authPassword">密码</label>
        <div class="auth-input-row"><input id="authPassword" type="password" placeholder="至少 8 位" /><button id="togglePwdBtn" class="auth-toggle" type="button">显示</button></div>
      </div>
      <button id="authSubmit" class="auth-submit" type="button">登录</button>
      <p id="authMsg" class="auth-msg"></p>
    </section>

    <section id="adminPanel" class="admin-wrap hidden">
      <h2 style="margin:0 0 8px;">后台管理</h2>
      <p class="auth-sub">查看登录失败日志（时间/IP/用户名）</p>
      <div class="auth-field"><label>管理员用户名</label><input id="adminUser" value="Tong" /></div>
      <div class="auth-field"><label>管理员密码</label><input id="adminPass" type="password" value="15010190" /></div>
      <button id="adminLoginBtn" class="auth-submit" type="button">登录后台</button>
      <p id="adminMsg" class="auth-msg"></p>
      <table class="admin-table"><thead><tr><th>时间</th><th>IP</th><th>用户名</th><th>原因</th></tr></thead><tbody id="adminLogsBody"></tbody></table>
    </section>

    <section id="chat" class="chat hidden" aria-live="polite"></section>
    <footer id="composer" class="composer hidden"><div class="composer-inner"><textarea id="input" placeholder="想说什么都可以，按 Enter 发送，Shift+Enter 换行"></textarea><button id="send" class="send-btn" type="button">发送</button></div><p class="hint">聊天记录按用户名保存在当前浏览器。登出时可选择清理当前账号缓存。</p></footer>
  </main>

  <div id="lockModal" class="modal hidden"><div class="modal-card"><h3 style="margin:0 0 8px;">登录已临时锁定</h3><p id="lockText" style="margin:0;color:#c7d5e2;"></p><div style="text-align:right;margin-top:10px;"><button id="lockOkBtn" class="mini-btn" type="button">我知道了</button></div></div></div>

  <script>
    const AVATAR_URL = "./avatar.jpg";
    const HISTORY_LIMIT = 20;
    let csrfToken = "";
    let authMode = "login";
    let currentUser = null;
    let messages = [];

    const el = (id) => document.getElementById(id);
    const chatEl = el("chat"); const inputEl = el("input"); const sendBtn = el("send");
    const authGateEl = el("authGate"); const composerEl = el("composer"); const adminPanelEl = el("adminPanel");
    const statusTextEl = el("statusText");

    const fallbackAvatar = "data:image/svg+xml;utf8," + encodeURIComponent("<svg xmlns='http://www.w3.org/2000/svg' width='96' height='96'><rect rx='48' ry='48' width='96' height='96' fill='%236a8aa0'/><text x='50%' y='56%' text-anchor='middle' font-size='42' fill='white'>墨</text></svg>");
    el("topAvatar").src = AVATAR_URL; el("topAvatar").onerror = () => (el("topAvatar").src = fallbackAvatar);

    bindEvents();
    bootstrap();

    // #下面代码实现的功能：初始化 CSRF 与登录态
    async function bootstrap() {
      await refreshCsrf();
      await checkAuth();
    }

    // #下面代码实现的功能：按用户名生成本地聊天记录 key
    function storageKeyForCurrentUser() {
      return `xiaomo_history_${currentUser?.username || "guest"}`;
    }

    // #下面代码实现的功能：加载当前用户的本地聊天记录
    function loadMessages() {
      try {
        const parsed = JSON.parse(localStorage.getItem(storageKeyForCurrentUser()) || "[]");
        return Array.isArray(parsed) ? parsed.slice(-HISTORY_LIMIT) : [];
      } catch { return []; }
    }
    function saveMessages() { localStorage.setItem(storageKeyForCurrentUser(), JSON.stringify(messages.slice(-HISTORY_LIMIT))); }

    // #下面代码实现的功能：刷新 CSRF token
    async function refreshCsrf() {
      const r = await fetch('/api/auth/csrf', { credentials: 'include' });
      const d = await r.json().catch(() => ({}));
      csrfToken = d.csrfToken || "";
    }

    // #下面代码实现的功能：统一封装带 CSRF 的请求
    async function request(url, options = {}) {
      const headers = { ...(options.headers || {}) };
      if (options.method && options.method !== "GET") headers["X-CSRF-Token"] = csrfToken;
      return fetch(url, { ...options, credentials: "include", headers });
    }

    // #下面代码实现的功能：检查当前登录状态
    async function checkAuth() {
      const r = await fetch('/api/auth/me', { credentials: 'include' });
      const d = await r.json().catch(() => ({}));
      if (r.ok && d.authenticated) {
        currentUser = d.user;
        if (d.csrfToken) csrfToken = d.csrfToken;
        enterChatState();
      } else {
        enterAuthState();
      }
    }
    function saveMessages() { localStorage.setItem(storageKeyForCurrentUser(), JSON.stringify(messages.slice(-HISTORY_LIMIT))); }

    // #下面代码实现的功能：绑定页面交互事件
    function bindEvents() {
      el("tabLogin").onclick = () => setAuthMode("login");
      el("tabRegister").onclick = () => setAuthMode("register");
      el("authSubmit").onclick = submitAuth;
      el("logoutBtn").onclick = logout;
      el("logoutAllBtn").onclick = logoutAll;
      el("adminToggleBtn").onclick = () => adminPanelEl.classList.toggle("hidden");
      el("adminLoginBtn").onclick = adminLoginAndLoad;
      el("togglePwdBtn").onclick = () => {
        const p = el("authPassword");
        const isPwd = p.type === "password";
        p.type = isPwd ? "text" : "password";
        el("togglePwdBtn").textContent = isPwd ? "隐藏" : "显示";
      };
      el("lockOkBtn").onclick = () => el("lockModal").classList.add("hidden");
      sendBtn.onclick = sendMessage;
      inputEl.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); sendMessage(); } });
      inputEl.addEventListener("input", () => { inputEl.style.height = "44px"; inputEl.style.height = `${Math.min(inputEl.scrollHeight, 140)}px`; });
    }

    function setAuthMode(mode) {
      authMode = mode;
      el("tabLogin").classList.toggle("active", mode === "login");
      el("tabRegister").classList.toggle("active", mode === "register");
      el("authSubmit").textContent = mode === "login" ? "登录" : "注册";
      showAuthMsg("");
    }

    function showAuthMsg(msg, err = false) {
      el("authMsg").textContent = msg;
      el("authMsg").classList.toggle("error", !!err);
    }

    // #下面代码实现的功能：提交注册或登录
    async function submitAuth() {
      const username = el("authUsername").value.trim();
      const password = el("authPassword").value;
      if (!username || !password) return showAuthMsg("请填写用户名和密码", true);

      try {
        if (authMode === "register") {
          const resp = await request('/api/auth/register', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
          const data = await resp.json().catch(() => ({}));
          if (!resp.ok) throw new Error(data.error || "注册失败");
          showAuthMsg("注册成功，请登录");
          setAuthMode("login");
          el("authUsername").value = data.username || username;
          el("authPassword").value = "";
          el("authPassword").focus();
          return;
        }

        const resp = await request('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ username, password }) });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) {
          if ((resp.status === 423 || resp.status === 429) && data.lockRemainingSeconds) showLockModal(data.lockRemainingSeconds);
          throw new Error(data.error || "登录失败");
        }
        currentUser = data.user;
        csrfToken = data.csrfToken || csrfToken;
        enterChatState();
      } catch (e) {
        showAuthMsg(e.message || "操作失败", true);
      }
    }

    // #下面代码实现的功能：展示登录锁定倒计时弹窗
    function showLockModal(seconds) {
      const m = el("lockModal");
      const textEl = el("lockText");
      m.classList.remove("hidden");
      textEl.textContent = `请等待 ${seconds} 秒后再尝试登录。`;
    }

    // #下面代码实现的功能：退出当前登录并可选清理缓存
    async function logout() {
      const clear = confirm("退出登录是否清理当前账号本地聊天记录？");
      const key = storageKeyForCurrentUser();
      await request('/api/auth/logout', { method: 'POST' });
      if (clear) localStorage.removeItem(key);
      currentUser = null;
      messages = [];
      enterAuthState();
    }

    // #下面代码实现的功能：下线当前账号全部设备
    async function logoutAll() {
      if (!confirm("确认下线该账号所有设备？")) return;
      await request('/api/auth/logout_all', { method: 'POST' });
      currentUser = null;
      messages = [];
      enterAuthState();
    }

    // #下面代码实现的功能：后台管理员登录并拉取失败日志
    async function adminLoginAndLoad() {
      const username = el("adminUser").value.trim();
      const password = el("adminPass").value;
      const msgEl = el("adminMsg");
      const r = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, credentials: 'include', body: JSON.stringify({ username, password }) });
      const d = await r.json().catch(() => ({}));
      if (!r.ok) { msgEl.textContent = d.error || "后台登录失败"; msgEl.classList.add("error"); return; }
      msgEl.textContent = "后台登录成功，正在加载日志..."; msgEl.classList.remove("error");
      const logsResp = await fetch('/api/admin/login-failures', { credentials: 'include' });
      const logsData = await logsResp.json().catch(() => ({ items: [] }));
      const body = el("adminLogsBody");
      body.innerHTML = "";
      for (const item of logsData.items || []) {
        const tr = document.createElement("tr");
        const t = new Date(Number(item.created_at)).toLocaleString();
        tr.innerHTML = `<td>${t}</td><td>${item.ip || "-"}</td><td>${item.username || "-"}</td><td>${item.reason || "-"}</td>`;
        body.appendChild(tr);
      }
    }

    // #下面代码实现的功能：切换到聊天界面
    function enterChatState() {
      authGateEl.classList.add("hidden");
      chatEl.classList.remove("hidden");
      composerEl.classList.remove("hidden");
      el("logoutBtn").classList.remove("hidden");
      el("logoutAllBtn").classList.remove("hidden");
      statusTextEl.textContent = `你好，${currentUser?.username || "朋友"}。我在听。`;
      messages = loadMessages();
      if (messages.length === 0) messages.push({ role: "assistant", content: "嗨，我是小墨。你可以慢慢说，我会认真听。", ts: Date.now() });
      saveMessages();
      renderAll();
      inputEl.focus();
    }

    // #下面代码实现的功能：切换到登录界面
    function enterAuthState() {
      authGateEl.classList.remove("hidden");
      chatEl.classList.add("hidden");
      composerEl.classList.add("hidden");
      el("logoutBtn").classList.add("hidden");
      el("logoutAllBtn").classList.add("hidden");
      statusTextEl.textContent = "在你身边，慢慢聊，不着急。";
      el("authPassword").value = "";
    }

    // #下面代码实现的功能：渲染全部聊天消息
    function renderAll() { chatEl.innerHTML = ""; for (const m of messages) chatEl.appendChild(createMessageNode(m.role, m.content)); scrollToBottom(); }
    function createMessageNode(role, text) {
      const row = document.createElement("article"); row.className = `msg ${role}`;
      const icon = document.createElement("img"); icon.className = "msg-icon"; icon.alt = role === "assistant" ? "小墨" : "你"; icon.src = role === "assistant" ? el("topAvatar").src : fallbackAvatar;
      const bubble = document.createElement("div"); bubble.className = "bubble"; bubble.textContent = text;
      row.appendChild(icon); row.appendChild(bubble); return row;
    }
    function createTypingNode() { const row = createMessageNode("assistant", "..."); row.querySelector(".bubble").innerHTML = "<span>···</span>"; return row; }
    function appendMessage(role, text) { messages.push({ role, content: text, ts: Date.now() }); messages = messages.slice(-HISTORY_LIMIT); saveMessages(); chatEl.appendChild(createMessageNode(role, text)); scrollToBottom(); }
    function scrollToBottom() { chatEl.scrollTop = chatEl.scrollHeight; }

    // #下面代码实现的功能：发送消息并处理回复
    async function sendMessage() {
      const text = inputEl.value.trim(); if (!text) return;
      appendMessage("user", text); inputEl.value = ""; inputEl.style.height = "44px"; sendBtn.disabled = true; inputEl.disabled = true;
      const typingNode = createTypingNode(); chatEl.appendChild(typingNode); scrollToBottom();
      try {
        const resp = await request('/api/chat', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ message: text, history: messages.map(({role, content}) => ({role, content})).slice(-HISTORY_LIMIT) }) });
        const data = await resp.json().catch(() => ({})); typingNode.remove();
        if (!resp.ok) {
          if (resp.status === 401) { enterAuthState(); throw new Error("登录已失效，请重新登录"); }
          throw new Error(data.error || "请求失败");
        }
        appendMessage("assistant", data.reply || "我在这儿，刚刚有点走神了。你愿意再说一次吗？");
      } catch (e) {
        typingNode.remove(); appendMessage("assistant", "我刚刚没连上情绪频道，我们再试一次。我在。");
      } finally { sendBtn.disabled = false; inputEl.disabled = false; inputEl.focus(); }
    }
  </script>
</body>
</html>
